# yaml-language-server: $schema=https://raw.githubusercontent.com/html2rss/html2rss/refs/heads/master/schema/html2rss-config.schema.json
registry:
  id: chathamhouse.org/research-publications
directory:
  topics:
    - civic
    - research
  title: "Chatham House — Research publications"
  summary: "Research publications from the Royal Institute of International Affairs."
strategy: botasaurus

channel:
  title: "Chatham House — Research publications"
  url: https://www.chathamhouse.org/publications/research-publications
  language: en
  time_zone: Europe/London
  ttl: 360
request:
  botasaurus:
    wait_for_selector: a.teaser__link
    wait_timeout_seconds: 20
selectors:
  items:
    selector: a.teaser__link
    enhance: false
  title:
    selector: .teaser__title
  url:
    extractor: href
