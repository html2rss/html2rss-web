name: dev image
description: Build the `dev` stage of the root Dockerfile (layer-cached) as html2rss/web:dev for docker-compose.dev.yml

runs:
  using: composite
  steps:
    - name: Match container user to runner user
      shell: bash
      run: |
        echo "DEV_UID=$(id -u)" >> "$GITHUB_ENV"
        echo "DEV_GID=$(id -g)" >> "$GITHUB_ENV"

    - uses: docker/setup-buildx-action@v4

    - uses: docker/bake-action@v7
      with:
        files: docker-compose.dev.yml
        targets: dev
        load: true
        set: |
          dev.cache-from=type=gha,scope=dev
          dev.cache-to=type=gha,mode=max,scope=dev
