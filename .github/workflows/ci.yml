name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true" # makes `make` on the runner delegate to the dev container without a TTY

jobs:
  hadolint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint Dockerfile
        run: docker run --rm -i hadolint/hadolint < Dockerfile

  compose-contract:
    needs:
      - hadolint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify compose contracts
        run: bin/compose-contract-verify

  ruby:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/dev-image

      - name: Lint (RuboCop, Zeitwerk, YARD)
        run: make lint-ruby

      - name: Run RSpec
        run: make test-ruby

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/dev-image

      - run: make frontend-setup
      - name: Verify generated OpenAPI spec and client are up to date
        run: make openapi-verify
      - name: Lint OpenAPI contract
        run: make openapi-lint

  frontend-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: frontend/package.json

      - name: Audit dependencies
        run: pnpm audit --audit-level=moderate

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/dev-image

      - run: make frontend-setup
      - name: Typecheck, lint, format
        run: make lint-js
      - name: Run frontend tests
        run: make test-frontend
      - name: Run frontend smoke test
        run: make test-frontend-e2e

  docker-build-smoke-image:
    needs:
      - hadolint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build Docker smoke image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: html2rss/web
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime

  docker-test:
    needs:
      - docker-build-smoke-image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        smoke_auto_source_enabled: ["false", "true"]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/dev-image

      - name: Load Docker smoke image from cache
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: html2rss/web
          cache-from: type=gha,scope=runtime

      - name: Run Docker smoke test
        env:
          DOCKER_SMOKE_SKIP_BUILD: "true"
          SMOKE_AUTO_SOURCE_ENABLED: ${{ matrix.smoke_auto_source_enabled }}
        run: rake
