name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DEV: docker compose -f docker-compose.dev.yml run --rm -T dev

jobs:
  hadolint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint Dockerfile
        run: docker run --rm -i hadolint/hadolint < Dockerfile

  compose-contract:
    needs:
      - hadolint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify compose contracts
        run: bin/compose-contract-verify

  ruby:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/dev-image

      - name: Run RuboCop
        run: $DEV bundle exec rubocop -F

      - name: Verify Yard documentation
        run: $DEV bundle exec yard doc --fail-on-warning --no-output

      - name: Run RSpec
        run: $DEV bundle exec rspec

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/dev-image

      - name: Install frontend dependencies for OpenAPI client verification
        run: $DEV make frontend-setup

      - name: Verify generated OpenAPI spec and client are up to date
        run: $DEV make openapi-verify

      - name: Lint OpenAPI contract
        run: $DEV make openapi-lint

  frontend-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/dev-image

      - name: Audit dependencies
        run: $DEV pnpm --dir frontend audit --audit-level=moderate

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/dev-image

      - name: Install dependencies
        run: $DEV make frontend-setup

      - name: Typecheck frontend
        run: $DEV pnpm --dir frontend run typecheck

      - name: Lint CSS with Stylelint
        run: $DEV pnpm --dir frontend exec stylelint "**/*.css"

      - name: Check formatting
        run: $DEV pnpm --dir frontend run format:check

      - name: Run frontend tests
        run: $DEV pnpm --dir frontend run test:ci

      - name: Run frontend smoke test
        run: $DEV pnpm --dir frontend run test:e2e

  docker-build-smoke-image:
    needs:
      - hadolint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build Docker smoke image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: html2rss/web
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime

  docker-test:
    needs:
      - docker-build-smoke-image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        smoke_auto_source_enabled: ["false", "true"]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Load Docker smoke image from cache
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: html2rss/web
          cache-from: type=gha,scope=runtime

      - name: Run Docker smoke test
        env:
          DOCKER_SMOKE_SKIP_BUILD: "true"
          SMOKE_AUTO_SOURCE_ENABLED: ${{ matrix.smoke_auto_source_enabled }}
        run: rake
