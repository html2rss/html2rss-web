name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DEV_IMAGE: html2rss/web:dev

jobs:
  hadolint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint Dockerfile
        run: docker run --rm -i hadolint/hadolint < Dockerfile

  compose-contract:
    needs:
      - hadolint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Make compose contract verifier executable
        run: chmod +x bin/compose-contract-verify
      - name: Verify compose contracts
        run: bin/compose-contract-verify

  build-dev:
    needs:
      - hadolint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build and load dev image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: dev
          load: true
          tags: ${{ env.DEV_IMAGE }}
          cache-from: type=gha,scope=dev
          cache-to: type=gha,mode=max,scope=dev

  ruby:
    needs:
      - build-dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Load dev image from cache
        uses: docker/build-push-action@v7
        with:
          context: .
          target: dev
          load: true
          tags: ${{ env.DEV_IMAGE }}
          cache-from: type=gha,scope=dev
      - name: Run RuboCop, YARD, and RSpec
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "$DEV_IMAGE" \
            bash -lc 'make setup && bundle exec rubocop -F && bundle exec yard doc --fail-on-warning --no-output && bundle exec rspec'
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  openapi:
    needs:
      - build-dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Load dev image from cache
        uses: docker/build-push-action@v7
        with:
          context: .
          target: dev
          load: true
          tags: ${{ env.DEV_IMAGE }}
          cache-from: type=gha,scope=dev
      - name: Verify and lint OpenAPI
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "$DEV_IMAGE" \
            bash -lc 'make setup && make openapi-verify && make openapi-lint'

  frontend-audit:
    needs:
      - build-dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Load dev image from cache
        uses: docker/build-push-action@v7
        with:
          context: .
          target: dev
          load: true
          tags: ${{ env.DEV_IMAGE }}
          cache-from: type=gha,scope=dev
      - name: Audit frontend dependencies
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "$DEV_IMAGE" \
            bash -lc 'make setup && pnpm --dir frontend audit --audit-level=moderate'

  frontend:
    needs:
      - build-dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Load dev image from cache
        uses: docker/build-push-action@v7
        with:
          context: .
          target: dev
          load: true
          tags: ${{ env.DEV_IMAGE }}
          cache-from: type=gha,scope=dev
      - name: Typecheck, lint, format, unit/contract, and e2e
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            -e CI=true \
            "$DEV_IMAGE" \
            bash -lc 'make setup && cd frontend && pnpm run typecheck && pnpm exec stylelint "**/*.css" && pnpm run format:check && pnpm run test:ci && pnpm run test:e2e'

  docker-build-smoke-image:
    needs:
      - hadolint
      - ruby
      - openapi
      - frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build Docker smoke image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: html2rss/web
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime

  docker-test:
    needs:
      - docker-build-smoke-image
      - build-dev
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        smoke_auto_source_enabled: ["false", "true"]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Load Docker smoke image from cache
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: html2rss/web
          cache-from: type=gha,scope=runtime
      - name: Load dev image from cache
        uses: docker/build-push-action@v7
        with:
          context: .
          target: dev
          load: true
          tags: ${{ env.DEV_IMAGE }}
          cache-from: type=gha,scope=dev
      - name: Run Docker smoke test
        env:
          DOCKER_SMOKE_SKIP_BUILD: "true"
          SMOKE_AUTO_SOURCE_ENABLED: ${{ matrix.smoke_auto_source_enabled }}
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            --network host \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -w "$GITHUB_WORKSPACE" \
            -e GITHUB_WORKSPACE \
            -e DOCKER_SMOKE_SKIP_BUILD \
            -e SMOKE_AUTO_SOURCE_ENABLED \
            -e GITHUB_SHA \
            "$DEV_IMAGE" \
            bash -lc 'make setup && bundle exec rake'
