name: Bump Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Explicit version to set (X.Y.Z, for example 1.4.0). Relative bumps are not accepted."
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

env:
  CI: "true"

jobs:
  bump_version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Assert main branch
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "Error: This workflow must be run against the main branch (refs/heads/main); got ${{ github.ref }}" >&2
            exit 1
          fi

      - name: Require explicit version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          version="${REQUESTED_VERSION#v}"
          version="${version#"${version%%[![:space:]]*}"}"
          version="${version%"${version##*[![:space:]]}"}"
          if [[ ! $version =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Error: version must be an explicit semver X.Y.Z." >&2
            exit 1
          fi
          echo "TARGET_VERSION=${version}" >> "$GITHUB_ENV"

      - uses: ./.github/actions/dev-image

      - name: Perform Version Bump
        id: perform_bump
        run: |
          docker compose -f docker-compose.dev.yml run --rm -T dev bundle exec ruby bin/bump-version "$TARGET_VERSION"
          NEW_VERSION=$(docker compose -f docker-compose.dev.yml run --rm -T dev ruby -I. -e "require 'config/version'; puts Html2rss::Web::VERSION")
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Regenerate OpenAPI spec and client
        run: |
          make frontend-setup
          make openapi
          make openapi-client

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.BUMP_VERSION_TOKEN || github.token }}
          commit-message: "chore: bump version to v${{ steps.perform_bump.outputs.new_version }}"
          branch: "bump-version/v${{ steps.perform_bump.outputs.new_version }}"
          title: "chore: bump version to v${{ steps.perform_bump.outputs.new_version }}"
          body: |
            Automated version bump to `v${{ steps.perform_bump.outputs.new_version }}`.

            This PR contains the version update in `config/version.rb` and regenerated OpenAPI specs and frontend API client.

            ### 🚀 Next Steps
            1. Verify that all CI checks pass.
            2. Merge this Pull Request.
            3. Go to the draft release on GitHub and publish it.
          assignees: ${{ github.actor }}
