name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

autolabeler:
  - label: 'enhancement'
    title:
      - '/^feat(\([^)]+\))?!?:/i'
  - label: 'bug'
    title:
      - '/^fix(\([^)]+\))?!?:/i'
  - label: 'chore'
    title:
      - '/^(chore|test|refactor|docs|ci|build|deps)(\([^)]+\))?!?:/i'

categories:
  - title: '🚀 Features'
    labels:
      - 'feature'
      - 'enhancement'
      - 'feat'
  - title: '🐛 Bug Fixes'
    labels:
      - 'bug'
      - 'fix'
  - title: '🧰 Maintenance'
    labels:
      - 'chore'
      - 'documentation'
      - 'dependencies'
      - 'refactor'
      - 'style'
      - 'test'
      - 'ci'

change-template: '- $TITLE @$AUTHOR (#$NUMBER)'

template: |
  $CHANGES

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION

  ---
  <!-- How to release:
  1. Dispatch the Bump Version workflow on `main` with `version` set to an explicit semver (`X.Y.Z`).
  2. Merge the version bump pull request into `main`.
  3. Publish this draft release on GitHub. This tags the commit and builds and publishes the Docker images.
  -->
