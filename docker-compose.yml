# Docker Compose configuration for html2rss-web
# This is the default configuration - customize as needed

services:
  html2rss-web:
    image: html2rss/web
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:4000"
    env_file:
      - path: .env
        required: false
    environment:
      RACK_ENV: production
      PORT: 4000
      BUILD_TAG: ${BUILD_TAG:-local}
      GIT_SHA: ${GIT_SHA:-local}
      HTML2RSS_SECRET_KEY: ${HTML2RSS_SECRET_KEY:?set HTML2RSS_SECRET_KEY}
      HEALTH_CHECK_TOKEN: ${HEALTH_CHECK_TOKEN:?set HEALTH_CHECK_TOKEN}
      # Web Sentry (Project A): SENTRY_DSN; logs opt-in via SENTRY_ENABLE_LOGS=true
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENABLE_LOGS: ${SENTRY_ENABLE_LOGS:-false}
      HTML2RSS_TOTAL_TIMEOUT_SECONDS: 50
      RACK_TIMEOUT_SERVICE_TIMEOUT: 55
      BOTASAURUS_SCRAPE_TIMEOUT_SECONDS: 45
      BOTASAURUS_SCRAPE_WORK_TIMEOUT_SECONDS: 30
      REGISTRY_DATA_ROOT: /app/data/registries
      BOTASAURUS_SCRAPER_URL: http://botasaurus:4010
    # Trial runs use the image's bundled config/feeds.yml.
    # Uncomment the block below when you want to replace it with your own file.
    # volumes:
    #   - type: bind
    #     source: ./config/feeds.yml
    #     target: /app/config/feeds.yml
    #     read_only: true
    volumes:
      - registry-data:/app/data/registries

  watchtower:
    image: containrrr/watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - "${HOME}/.docker/config.json:/config.json"
    command: --cleanup --interval 7200

  botasaurus:
    image: html2rss/botasaurus-scrape-api:latest
    restart: unless-stopped
    environment:
      # Scraper Sentry (Project B): BOTASAURUS_SENTRY_DSN only — not web SENTRY_DSN
      SENTRY_DSN: ${BOTASAURUS_SENTRY_DSN:?set BOTASAURUS_SENTRY_DSN}
      SENTRY_ENVIRONMENT: ${ENVIRONMENT:-production}
      SENTRY_RELEASE: ${GIT_SHA:-unknown}
      SCRAPE_TIMEOUT_SECONDS: 45
      SCRAPE_WORK_TIMEOUT_SECONDS: 30
    ports:
      - "127.0.0.1:4010:4010"

  registry-sync:
    image: html2rss/web
    restart: unless-stopped
    command: ["sh", "-c", "while true; do html2rss-web registry sync; sleep $${REGISTRY_SYNC_INTERVAL_SECONDS:-86400}; done"]
    env_file:
      - path: .env
        required: false
    environment:
      REGISTRY_DATA_ROOT: /app/data/registries
      REGISTRY_SYNC_INTERVAL_SECONDS: ${REGISTRY_SYNC_INTERVAL_SECONDS:-86400}
    volumes:
      - registry-data:/app/data/registries

volumes:
  registry-data:
