plugins:
  - rubocop-performance
  - rubocop-rspec
  - rubocop-rake
  - rubocop-thread_safety

AllCops:
  TargetRubyVersion: 4.0
  DisplayCopNames: true
  NewCops: enable
  Exclude:
    - '**/*.yml'
    - '**/*.yaml'
    - '**/.tool-versions'
    - 'coverage/**/*'
    - 'frontend/node_modules/**/*'
    - 'frontend/test-results/**/*'
    - 'public/frontend/**/*'
    - 'tmp/**/*'
    - 'vendor/**/*'

Layout/LineLength:
  Max: 120

Metrics/BlockLength:
  Exclude:
    - Rakefile
  AllowedMethods:
    - route

Naming/RescuedExceptionsVariableName:
  PreferredName: error

Layout/ClassStructure:
  Enabled: true

Style/Documentation:
  Enabled: false
  AllowedConstants:
    - App

RSpec/DescribeClass:
  Enabled: false

Style/ItBlockParameter:
  Enabled: true

RSpec/ExampleLength:
  Max: 12

RSpec/MultipleExpectations:
  Max: 2
