---
components:
  schemas:
    FieldSelectorCandidate:
      additionalProperties: false
      description: One ranked field selector with a sample headline. Best match is
        first.
      properties:
        sample:
          description: Visible text of a matched node
          type: string
        selector:
          type: string
      required:
      - selector
      - sample
      type: object
    Html2rssExtractorAttribute:
      const: attribute
      description: Return the value of an HTML attribute on the selected element.
        Requires sibling selector option `attribute` (attribute name).
      examples:
      - attribute
      title: attribute
      type: string
    Html2rssExtractorHref:
      const: href
      description: Return the absolute URL from the selected element's `href` attribute
        (relative hrefs are resolved against the page base URL).
      examples:
      - href
      title: href
      type: string
    Html2rssExtractorHtml:
      const: html
      description: Return the outer HTML of the selected element. Sanitize during
        post-processing (e.g. `sanitize_html`).
      examples:
      - html
      title: html
      type: string
    Html2rssExtractorStatic:
      const: static
      description: Return a fixed value from sibling selector option `static` (no
        DOM read).
      examples:
      - static
      title: static
      type: string
    Html2rssExtractorText:
      const: text
      description: Return collapsed visible text of the selected element (default
        extractor).
      examples:
      - text
      title: text
      type: string
    Html2rssPostProcessorGsub:
      additionalProperties: true
      description: Replace matches of `pattern` in the extracted string with `replacement`
        (Ruby String#gsub; pattern may be a regexp-like string). Patterns over 256
        characters as written, or with nested quantifiers, are rejected.
      examples:
      - name: gsub
        pattern: boo
        replacement: baz
      properties:
        name:
          const: gsub
          type: string
        pattern:
          maxLength: 256
          type: string
        replacement:
          type:
          - string
          - object
      required:
      - name
      - pattern
      - replacement
      title: gsub
      type: object
    Html2rssPostProcessorMarkdownToHtml:
      additionalProperties: true
      description: Convert Markdown to HTML (Kramdown) and sanitize the result. Often
        chained after `template`.
      examples:
      - name: markdown_to_html
      properties:
        name:
          const: markdown_to_html
          type: string
      required:
      - name
      title: markdown_to_html
      type: object
    Html2rssPostProcessorParseTime:
      additionalProperties: true
      description: Parse a time string with Time.parse and return RFC822, using the
        channel `time_zone`.
      examples:
      - name: parse_time
      properties:
        name:
          const: parse_time
          type: string
      required:
      - name
      title: parse_time
      type: object
    Html2rssPostProcessorParseUri:
      additionalProperties: true
      description: Normalize a URL string; resolve relative URLs against the channel
        URL.
      examples:
      - name: parse_uri
      properties:
        name:
          const: parse_uri
          type: string
      required:
      - name
      title: parse_uri
      type: object
    Html2rssPostProcessorSanitizeHtml:
      additionalProperties: true
      description: 'Sanitize HTML (sanitize gem RELAXED plus html2rss defaults: absolute
        URLs, safe link/img attributes, wrap lone images in anchors).'
      examples:
      - name: sanitize_html
      properties:
        name:
          const: sanitize_html
          type: string
      required:
      - name
      title: sanitize_html
      type: object
    Html2rssPostProcessorSubstring:
      additionalProperties: true
      description: Return a slice of the extracted string using Integer `start` and
        optional `end` (Ruby String#[] range semantics; end may be omitted).
      examples:
      - end: 6
        name: substring
        start: 4
      properties:
        end:
          type: integer
        name:
          const: substring
          type: string
        start:
          type: integer
      required:
      - name
      - start
      title: substring
      type: object
    Html2rssPostProcessorTemplate:
      additionalProperties: true
      description: Format a string with Kernel#format-style placeholders (`%{key}`
        / `%<key>s`). `%{self}` is the current selector value; other keys resolve
        sibling selectors.
      examples:
      - name: template
        string: "`%{self}` (`%{price}`)"
      properties:
        name:
          const: template
          type: string
        string:
          type: string
      required:
      - name
      - string
      title: template
      type: object
    ItemsSelectorCandidate:
      additionalProperties: false
      description: One ranked items selector with a sample headline. Best match is
        first.
      properties:
        enhance:
          type: boolean
        sample:
          description: Visible text of a matched node
          type: string
        selector:
          type: string
      required:
      - selector
      - enhance
      - sample
      type: object
    PreviewSampleItem:
      description: One preview meadow row returned by POST /feeds/preview.
      properties:
        image:
          type:
          - string
          - 'null'
        published_at:
          type:
          - string
          - 'null'
        title:
          type: string
        url:
          type:
          - string
          - 'null'
      required:
      - title
      type: object
    SelectorCandidates:
      additionalProperties: false
      description: Ranked selector candidates. Empty buckets are a successful response.
      properties:
        items:
          items:
            "$ref": "#/components/schemas/ItemsSelectorCandidate"
          type: array
        link:
          items:
            "$ref": "#/components/schemas/FieldSelectorCandidate"
          type: array
        published:
          items:
            "$ref": "#/components/schemas/FieldSelectorCandidate"
          type: array
        title:
          items:
            "$ref": "#/components/schemas/FieldSelectorCandidate"
          type: array
      required:
      - items
      - title
      - link
      - published
      type: object
    SelectorsDocument:
      additionalProperties: true
      description: Selectors used to extract article attributes.
      patternProperties:
        "^(?!items$|enclosure$|guid$|categories$).+$":
          description: Dynamic selector definition keyed by attribute name.
          properties:
            attribute:
              minLength: 1
              type: string
            extractor:
              description: Extractor used to pull a value from the selected element.
              oneOf:
              - "$ref": "#/components/schemas/Html2rssExtractorAttribute"
              - "$ref": "#/components/schemas/Html2rssExtractorHref"
              - "$ref": "#/components/schemas/Html2rssExtractorHtml"
              - "$ref": "#/components/schemas/Html2rssExtractorStatic"
              - "$ref": "#/components/schemas/Html2rssExtractorText"
            post_process:
              description: Ordered transforms applied to the extracted value.
              items:
                oneOf:
                - "$ref": "#/components/schemas/Html2rssPostProcessorGsub"
                - "$ref": "#/components/schemas/Html2rssPostProcessorMarkdownToHtml"
                - "$ref": "#/components/schemas/Html2rssPostProcessorParseTime"
                - "$ref": "#/components/schemas/Html2rssPostProcessorParseUri"
                - "$ref": "#/components/schemas/Html2rssPostProcessorSanitizeHtml"
                - "$ref": "#/components/schemas/Html2rssPostProcessorSubstring"
                - "$ref": "#/components/schemas/Html2rssPostProcessorTemplate"
              type: array
            static:
              minLength: 1
              type: string
          required: []
          type: object
      properties:
        categories:
          description: List of selector keys whose values will be used as categories.
            Each entry must reference a sibling selector key; runtime validation enforces
            those references.
          items:
            description: Selector key defined elsewhere in this object.
            type: string
          minItems: 1
          type: array
        enclosure:
          description: Describes enclosure extraction settings.
          properties:
            attribute:
              minLength: 1
              type: string
            content_type:
              minLength: 1
              pattern: "^[\\w-]+\\/[\\w-]+$"
              type: string
            extractor:
              description: Extractor used to pull a value from the selected element.
              oneOf:
              - "$ref": "#/components/schemas/Html2rssExtractorAttribute"
              - "$ref": "#/components/schemas/Html2rssExtractorHref"
              - "$ref": "#/components/schemas/Html2rssExtractorHtml"
              - "$ref": "#/components/schemas/Html2rssExtractorStatic"
              - "$ref": "#/components/schemas/Html2rssExtractorText"
            post_process:
              description: Ordered transforms applied to the extracted value.
              items:
                oneOf:
                - "$ref": "#/components/schemas/Html2rssPostProcessorGsub"
                - "$ref": "#/components/schemas/Html2rssPostProcessorMarkdownToHtml"
                - "$ref": "#/components/schemas/Html2rssPostProcessorParseTime"
                - "$ref": "#/components/schemas/Html2rssPostProcessorParseUri"
                - "$ref": "#/components/schemas/Html2rssPostProcessorSanitizeHtml"
                - "$ref": "#/components/schemas/Html2rssPostProcessorSubstring"
                - "$ref": "#/components/schemas/Html2rssPostProcessorTemplate"
              type: array
            static:
              minLength: 1
              type: string
          required: []
          type: object
        guid:
          description: List of selector keys used to build the GUID. Each entry must
            reference a sibling selector key; runtime validation enforces those references.
          items:
            description: Selector key defined elsewhere in this object.
            type: string
          minItems: 1
          type: array
        items:
          description: Defines the items selector and list-card enhance settings.
          properties:
            enhance:
              description: 'List-card enrichment: run Html::ArticleExtractor on each
                matched item node to fill missing fields from the card HTML.'
              not:
                type: 'null'
              type: boolean
            order:
              enum:
              - reverse
              not:
                type: 'null'
            pagination:
              description: Pagination configuration or maximum page count integer.
              oneOf:
              - exclusiveMinimum: 0
                type: integer
              - additionalProperties: true
                properties:
                  cursor_path:
                    type: string
                  increment:
                    exclusiveMinimum: 0
                    type: integer
                  max_pages:
                    exclusiveMinimum: 0
                    type: integer
                  next_url_path:
                    type: string
                  param:
                    type: string
                  selector:
                    type: string
                  start_offset:
                    type: integer
                  start_page:
                    type: integer
                  step:
                    exclusiveMinimum: 0
                    type: integer
                  strategy:
                    enum:
                    - rel_next
                    - custom_selector
                    - url_template
                    - offset
                    - json_cursor
                    type: string
                type: object
            selector:
              default: a[href]
              minLength: 1
              type: string
          required: []
          type: object
      type: object
  securitySchemes:
    BearerAuth:
      bearerFormat: JWT
      description: Bearer token authentication for API access.
      scheme: bearer
      type: http
info:
  contact:
    name: html2rss-web Support
    url: https://github.com/html2rss/html2rss-web
  description: RESTful API for converting websites to RSS feeds.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  title: html2rss-web API
  version: 1.13.0
openapi: 3.1.0
paths:
  "/":
    get:
      description: API metadata
      operationId: getApiMetadata
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      api:
                        properties:
                          description:
                            type: string
                          name:
                            type: string
                          openapi_url:
                            type: string
                        required:
                        - name
                        - description
                        - openapi_url
                        type: object
                      instance:
                        properties:
                          catalog:
                            properties:
                              enabled:
                                type: boolean
                              url:
                                type: string
                            required:
                            - enabled
                            - url
                            type: object
                          feed_creation:
                            properties:
                              access_token_required:
                                type: boolean
                              enabled:
                                type: boolean
                            required:
                            - enabled
                            - access_token_required
                            type: object
                          studio:
                            properties:
                              enabled:
                                type: boolean
                            required:
                            - enabled
                            type: object
                        required:
                        - feed_creation
                        - studio
                        - catalog
                        type: object
                    required:
                    - api
                    - instance
                    type: object
                  success:
                    type: boolean
                required:
                - success
                - data
                type: object
          description: API metadata
      security:
      - {}
      summary: API metadata
      tags:
      - Root
  "/configs":
    get:
      description: Config catalog
      operationId: getConfigCatalog
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      configs:
                        items:
                          properties:
                            channel:
                              properties:
                                language:
                                  type: string
                                title:
                                  type: string
                                url:
                                  type: string
                              required:
                              - url
                              - language
                              - title
                              type: object
                            directory:
                              properties:
                                summary:
                                  type: string
                                title:
                                  type: string
                                topics:
                                  items:
                                    type: string
                                  type: array
                              required:
                              - title
                              - summary
                              - topics
                              type: object
                            id:
                              type: string
                            last_result:
                              properties:
                                at:
                                  type:
                                  - string
                                  - 'null'
                                code:
                                  type:
                                  - string
                                  - 'null'
                                state:
                                  type: string
                              required:
                              - state
                              - code
                              - at
                              type: object
                            parameters:
                              properties:
                                defaults:
                                  properties:
                                    blog:
                                      type:
                                      - string
                                      - 'null'
                                    id:
                                      type:
                                      - string
                                      - 'null'
                                    region:
                                      type:
                                      - string
                                      - 'null'
                                    repository:
                                      type:
                                      - string
                                      - 'null'
                                    section:
                                      type:
                                      - string
                                      - 'null'
                                    user_id:
                                      type:
                                      - string
                                      - 'null'
                                    username:
                                      type:
                                      - string
                                      - 'null'
                                  type: object
                                schema:
                                  properties:
                                    blog:
                                      properties:
                                        type:
                                          type: string
                                      required:
                                      - type
                                      type:
                                      - object
                                      - 'null'
                                    id:
                                      properties:
                                        type:
                                          type: string
                                      required:
                                      - type
                                      type:
                                      - object
                                      - 'null'
                                    region:
                                      properties:
                                        type:
                                          type: string
                                      required:
                                      - type
                                      type:
                                      - object
                                      - 'null'
                                    repository:
                                      properties:
                                        type:
                                          type: string
                                      required:
                                      - type
                                      type:
                                      - object
                                      - 'null'
                                    section:
                                      properties:
                                        type:
                                          type: string
                                      required:
                                      - type
                                      type:
                                      - object
                                      - 'null'
                                    user_id:
                                      properties:
                                        type:
                                          type: string
                                      required:
                                      - type
                                      type:
                                      - object
                                      - 'null'
                                    username:
                                      properties:
                                        type:
                                          type: string
                                      required:
                                      - type
                                      type:
                                      - object
                                      - 'null'
                                  type: object
                              required:
                              - schema
                              - defaults
                              type: object
                            path:
                              type: string
                            source:
                              type: string
                          required:
                          - id
                          - path
                          - source
                          - directory
                          - channel
                          - parameters
                          - last_result
                          type: object
                        type: array
                    required:
                    - configs
                    type: object
                  meta:
                    properties:
                      catalog_version:
                        type: integer
                      starters:
                        items:
                          type: string
                        type: array
                      total:
                        type: integer
                    required:
                    - total
                    - catalog_version
                    - starters
                    type: object
                  success:
                    type: boolean
                required:
                - success
                - data
                - meta
                type: object
          description: Config catalog
        '404':
          content:
            application/json:
              schema:
                properties:
                  error:
                    type: string
                required:
                - error
                type: object
          description: Config catalog
      security:
      - {}
      summary: Config catalog
      tags:
      - Catalog
    options:
      description: Config catalog preflight
      operationId: optionsConfigCatalog
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              properties: {}
              type: object
      responses:
        '204':
          description: Config catalog preflight
      security:
      - {}
      summary: Config catalog preflight
      tags:
      - Catalog
  "/feeds":
    post:
      description: Create a feed
      operationId: createFeed
      parameters:
      - in: header
        name: Authorization
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              properties:
                name:
                  type: string
                selectors:
                  "$ref": "#/components/schemas/SelectorsDocument"
                url:
                  type: string
              required:
              - url
              type: object
      responses:
        '201':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      feed:
                        properties:
                          created_at:
                            type: string
                          feed_token:
                            type: string
                          id:
                            type: string
                          json_public_url:
                            type: string
                          name:
                            type: string
                          public_url:
                            type: string
                          updated_at:
                            type: string
                          url:
                            type: string
                        required:
                        - id
                        - name
                        - url
                        - feed_token
                        - public_url
                        - json_public_url
                        - created_at
                        - updated_at
                        type: object
                    required:
                    - feed
                    type: object
                  meta:
                    properties:
                      created:
                        type: boolean
                    required:
                    - created
                    type: object
                  success:
                    type: boolean
                required:
                - success
                - data
                - meta
                type: object
          description: Create a feed
        '400':
          content:
            application/json:
              schema:
                properties:
                  error:
                    properties:
                      code:
                        type: string
                      kind:
                        type: string
                      message:
                        type: string
                      next_action:
                        type: string
                      retry_action:
                        type: string
                      retryable:
                        type: boolean
                    required:
                    - code
                    - message
                    - kind
                    - retryable
                    - next_action
                    - retry_action
                    type: object
                  success:
                    type: boolean
                required:
                - success
                - error
                type: object
          description: Create a feed
        '401':
          content:
            application/json:
              schema:
                properties:
                  error:
                    properties:
                      code:
                        type: string
                      kind:
                        type: string
                      message:
                        type: string
                      next_action:
                        type: string
                      retry_action:
                        type: string
                      retryable:
                        type: boolean
                    required:
                    - code
                    - message
                    - kind
                    - retryable
                    - next_action
                    - retry_action
                    type: object
                  success:
                    type: boolean
                required:
                - success
                - error
                type: object
          description: Create a feed
        '403':
          content:
            application/json:
              schema:
                properties:
                  error:
                    properties:
                      code:
                        type: string
                      kind:
                        type: string
                      message:
                        type: string
                      next_action:
                        type: string
                      retry_action:
                        type: string
                      retryable:
                        type: boolean
                    required:
                    - code
                    - message
                    - kind
                    - retryable
                    - next_action
                    - retry_action
                    type: object
                  success:
                    type: boolean
                required:
                - success
                - error
                type: object
          description: Create a feed
        '429':
          content:
            application/json:
              schema:
                properties:
                  error:
                    properties:
                      code:
                        type: string
                      kind:
                        type: string
                      message:
                        type: string
                      next_action:
                        type: string
                      retry_action:
                        type: string
                      retryable:
                        type: boolean
                    required:
                    - code
                    - message
                    - kind
                    - retryable
                    - next_action
                    - retry_action
                    type: object
                  success:
                    type: boolean
                required:
                - success
                - error
                type: object
          description: Create a feed
          headers:
            Retry-After:
              schema:
                type: integer
      security:
      - BearerAuth: []
      summary: Create a feed
      tags:
      - Feeds
  "/feeds/preview":
    post:
      description: Preview a selectors document feed
      operationId: previewFeed
      parameters:
      - in: header
        name: Authorization
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              properties:
                selectors:
                  "$ref": "#/components/schemas/SelectorsDocument"
                url:
                  type: string
              required:
              - url
              - selectors
              type: object
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      failure_kind:
                        type:
                        - string
                        - 'null'
                      item_count:
                        type: integer
                      quality_report:
                        properties:
                          metrics:
                            properties:
                              short_title_count:
                                type: integer
                            required:
                            - short_title_count
                            type: object
                          warnings:
                            items:
                              type: string
                            type: array
                        required:
                        - warnings
                        - metrics
                        type:
                        - object
                        - 'null'
                      sample_items:
                        items:
                          "$ref": "#/components/schemas/PreviewSampleItem"
                        type: array
                      validation_issues:
                        items: {}
                        type: array
                    required:
                    - item_count
                    - sample_items
                    - quality_report
                    - failure_kind
                    - validation_issues
                    type: object
                  success:
                    type: boolean
                required:
                - success
                - data
                type: object
          description: Preview a selectors document feed
      security:
      - BearerAuth: []
      summary: Preview a selectors document feed
      tags:
      - Studio
  "/feeds/suggest_selectors":
    post:
      description: Suggest selectors for a page
      operationId: suggestSelectors
      parameters:
      - in: header
        name: Authorization
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              properties:
                items_selector:
                  type: string
                url:
                  type: string
              required:
              - url
              - items_selector
              type: object
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      admission_drops:
                        properties:
                          chrome:
                            type: integer
                        type: object
                      candidates:
                        "$ref": "#/components/schemas/SelectorCandidates"
                      segment_strategy:
                        type: string
                    required:
                    - candidates
                    - segment_strategy
                    - admission_drops
                    type: object
                  success:
                    type: boolean
                required:
                - success
                - data
                type: object
          description: Suggest selectors for a page
        '422':
          content:
            application/json:
              schema:
                properties:
                  error:
                    properties:
                      code:
                        type: string
                      kind:
                        type: string
                      message:
                        type: string
                      next_action:
                        type: string
                      retry_action:
                        type: string
                      retryable:
                        type: boolean
                    required:
                    - code
                    - message
                    - kind
                    - retryable
                    - next_action
                    - retry_action
                    type: object
                  success:
                    type: boolean
                required:
                - success
                - error
                type: object
          description: Suggest selectors for a page
      security:
      - BearerAuth: []
      summary: Suggest selectors for a page
      tags:
      - Studio
  "/feeds/validate":
    post:
      description: Validate a selectors document
      operationId: validateFeedConfig
      parameters:
      - in: header
        name: Authorization
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              properties:
                selectors:
                  "$ref": "#/components/schemas/SelectorsDocument"
                url:
                  type: string
                yaml:
                  type: string
              type: object
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    properties:
                      report:
                        properties:
                          issues:
                            items:
                              properties:
                                actual:
                                  description: JSON-ish value, or null when the issue
                                    carries none.
                                code:
                                  enum:
                                  - constraint
                                  - invalid_value
                                  - missing_key
                                  - parse
                                  - type_mismatch
                                  - unknown_value
